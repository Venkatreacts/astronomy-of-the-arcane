<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1440px;height:900px;overflow:hidden;background:#fbf6e9;color:#151515;font-family:Nunito,sans-serif}
h1{font-family:"Permanent Marker";font-size:84px;margin:60px 0 0 80px}
.hl{background:linear-gradient(transparent 55%,#ffd84a 55%)}
.panel{position:absolute;border:3px solid #151515;border-radius:12px;background:#fff;padding:24px}
.p1{left:80px;top:220px;width:560px;height:520px}.p2{left:700px;top:220px;width:640px;height:520px}
.n{font-family:"Permanent Marker";font-size:28px}
p{font-size:20px;line-height:1.5}
svg{display:block}
</style></head><body>
<h1>Is this trend <span class="hl">real?</span></h1>
<div class="panel p1"><div class="n">1. Pure noise</div>
<svg width="500" height="260"><path d="M10 150 Q40 90 70 140 T130 120 T190 170 T250 110 T310 150 T370 90 T430 140 T490 120" fill="none" stroke="#151515" stroke-width="4"/><path d="M20 190 L480 80" stroke="#ff7eb6" stroke-width="5" stroke-dasharray="10 8"/></svg>
<p>The usual test draws a trend through this. It's just sticky noise.</p></div>
<div class="panel p2"><div class="n">2. The honest test</div><p>It knows weather remembers last month. 21% fake trends drop to 0%.</p>
<svg width="580" height="240"><rect x="20" y="40" width="240" height="160" fill="#ff7eb6"/><rect x="320" y="180" width="240" height="20" fill="#2ab7a9"/></svg></div>
</body></html>
